<body>
<div id="phone">
  <div id="island"></div>
  <div id="status"><span id="st">9:41</span>
    <div><svg viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
    <svg viewBox="0 0 17 12"><path d="M8.5 2.2c2.3 0 4.4.9 6 2.4l1-1.1A10.4 10.4 0 0 0 8.5.7C5.8.7 3.3 1.7 1.5 3.5l1 1.1a8.6 8.6 0 0 1 6-2.4zm0 3.4c1.4 0 2.6.5 3.6 1.4l1-1.1a7 7 0 0 0-9.2 0l1 1.1c1-.9 2.2-1.4 3.6-1.4zm0 3.2c-.7 0-1.3.3-1.8.7l1.8 2 1.8-2c-.5-.4-1.1-.7-1.8-.7z"/></svg>
    <svg viewBox="0 0 27 12" style="height:13px"><rect x=".5" y=".5" width="22" height="11" rx="3.5" fill="none" stroke="#fff" opacity=".4"/><rect x="2" y="2" width="19" height="8" rx="2"/><rect x="24" y="4" width="2" height="4" rx="1" opacity=".5"/></svg></div>

    <svg class="lk" viewBox="0 0 16 22"><path d="M8 0a5 5 0 0 0-5 5v3H2a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2h-1V5a5 5 0 0 0-5-5zm-3 5a3 3 0 0 1 6 0v3H5z"/></svg>
    <div id="ld"></div>
    <div id="lt"></div>
    <div id="notes"></div>

</div>

<script>
const $=s=>document.querySelector(s);
const APPS={kakao:["카카오톡"],msg:["메시지"],cal:["캘린더"],memo:["메모"],mail:["메일"],set:["설정"],photo:["사진"],map:["지도"]};
const _t=new Date();
const PET=["#ff9500","#ffcc00","#a8e05f","#34c759","#32ade6","#5e5ce6","#bf5af2","#ff375f"];
const ICON={
kakao:`<rect width="60" height="60" fill="#FEE500"/><ellipse cx="30" cy="28" rx="20" ry="15.5" fill="#3A1D1D"/><path d="M17 38l-3 9 10-5z" fill="#3A1D1D"/>`,
msg:`<rect width="60" height="60" fill="url(#gm)"/><ellipse cx="30" cy="28" rx="19" ry="15" fill="#fff"/><path d="M16 38l-3 8 9-4z" fill="#fff"/>`,
cal:`<rect width="60" height="60" fill="#fff"/><text x="30" y="18" font-size="10" font-weight="600" fill="#ff3b30" text-anchor="middle">${_t.toLocaleDateString("ko-KR",{weekday:"short"})}</text><text x="30" y="47" font-size="31" font-weight="300" fill="#111" text-anchor="middle">${_t.getDate()}</text>`,
memo:`<rect width="60" height="60" fill="#fff"/><rect width="60" height="14" fill="#FFD60A"/><path d="M10 29h40M10 38h40M10 47h40" stroke="#d1d1d6" stroke-width="1.5"/>`,
mail:`<rect width="60" height="60" fill="url(#gl)"/><rect x="12" y="17" width="36" height="26" rx="4" fill="#fff"/><path d="M13 20l17 13 17-13" fill="none" stroke="#1a8cff" stroke-width="2.5" stroke-linejoin="round"/>`,
set:`<rect width="60" height="60" fill="url(#gs)"/><circle cx="30" cy="30" r="15" fill="none" stroke="#48484a" stroke-width="5.5" stroke-dasharray="5.9 5.9"/><circle cx="30" cy="30" r="12.5" fill="#48484a"/><circle cx="30" cy="30" r="8.5" fill="none" stroke="#aeaeb2" stroke-width="1.6"/><circle cx="30" cy="30" r="3.5" fill="#8e8e93"/>`,
photo:`<rect width="60" height="60" fill="#fff"/>${PET.map((c,i)=>`<ellipse cx="30" cy="19.5" rx="6" ry="10.5" fill="${c}" style="mix-blend-mode:multiply" transform="rotate(${i*45} 30 30)"/>`).join("")}`,
map:`<rect width="60" height="60" fill="#eef0e6"/><rect x="34" y="-4" width="30" height="30" fill="#a8d8f0"/><path d="M-5 50L65 14" stroke="#fff" stroke-width="9"/><circle cx="26" cy="36" r="11" fill="#0a84ff" stroke="#fff" stroke-width="3"/><path d="M26 29l5.5 12-5.5-3-5.5 3z" fill="#fff"/>`
};
const SQ=(()=>{let d="";for(let i=0;i<=120;i++){const a=i/120*2*Math.PI,c=Math.cos(a),n=Math.sin(a),f=v=>Math.sign(v)*Math.pow(Math.abs(v),.4);d+=(i?"L":"M")+(30+30*f(c)).toFixed(2)+" "+(30+30*f(n)).toFixed(2)}return d+"Z"})();
document.body.insertAdjacentHTML("afterbegin",`<svg width="0" height="0" style="position:absolute"><defs><clipPath id="sq"><path d="${SQ}"/></clipPath><linearGradient id="gm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5BF675"/><stop offset="1" stop-color="#0CBD2A"/></linearGradient><linearGradient id="gl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1AC8FB"/><stop offset="1" stop-color="#0A7AFF"/></linearGradient><linearGradient id="gs" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d4d4d9"/><stop offset="1" stop-color="#8e8e93"/></linearGradient></defs></svg>`);
const PAGES=[["cal","memo","map","set"]];
const DOCK=["kakao","msg","mail","photo"];
const mk=id=>`<div class="ic" data-app="${id}"><svg viewBox="0 0 60 60"><g clip-path="url(#sq)">${ICON[id]}</g></svg><span>${APPS[id][0]}</span></div>`;
$("#pages").innerHTML=PAGES.map(p=>`<div class="pg">${p.map(mk).join("")}</div>`).join("");
$("#dock").innerHTML=DOCK.map(mk).join("");
const dots=$("#dots");
function setDots(){const n=PAGES.length;if(n<2)return;const i=Math.round($("#pages").scrollLeft/$("#pages").clientWidth);dots.innerHTML=Array.from({length:n},(_,k)=>`<b class="${k==i?"on":""}"></b>`).join("")}
$("#pages").addEventListener("scroll",setDots);setDots();

/* 일정 데이터: 여기만 고치면 됩니다 */
const EVENTS=[
  {id:1,title:"입학",date:"2026-11-29"}
];
const gone=new Set();
function dleft(s){const[y,m,d]=s.split("-").map(Number),t=new Date();return Math.round((new Date(y,m-1,d)-new Date(t.getFullYear(),t.getMonth(),t.getDate()))/864e5)}
const label=n=>n===0?"오늘":n===1?"내일":n+"일 후";
function upcoming(){return EVENTS.filter(e=>!gone.has(e.id)).map(e=>({...e,n:dleft(e.date)})).filter(e=>e.n>=0).sort((a,b)=>a.n-b.n)}

/* 잠금 화면 */
const lock=$("#lock");
function drawNotes(){
  const box=$("#notes");box.innerHTML="";
  upcoming().slice(0,3).forEach(ev=>{
    const c=document.createElement("div");c.className="note";
    c.innerHTML=`<i>📅</i><div><small><span>캘린더</span><span>지금</span></small><b>${ev.title}</b><em>${label(ev.n)}</em></div>`;
    let x0=null,dx=0;
    c.onpointerdown=e=>{e.stopPropagation();x0=e.clientX;dx=0;c.setPointerCapture(e.pointerId);c.style.transition="none"};
    c.onpointermove=e=>{if(x0==null)return;dx=e.clientX-x0;if(dx<0)c.style.transform=`translateX(${dx}px)`};
    c.onpointerup=()=>{if(x0==null)return;c.style.transition="";x0=null;
      if(dx<-80){c.style.transform="translateX(-120%)";c.style.opacity=0;gone.add(ev.id);setTimeout(()=>c.remove(),300)}
      else{c.style.transform="";if(Math.abs(dx)<6){unlock();openApp("cal",ev.date)}}};
    box.appendChild(c);
  });
}
function unlock(){lock.style.transform="";lock.classList.add("up")}
function relock(){closeApp(true);drawNotes();lock.classList.remove("up")}
let sy=null,dy=0;
lock.addEventListener("pointerdown",e=>{sy=e.clientY;dy=0;lock.style.transition="none"});
addEventListener("pointermove",e=>{if(sy==null)return;dy=Math.min(0,e.clientY-sy);lock.style.transform=`translateY(${dy}px)`});
addEventListener("pointerup",()=>{if(sy==null)return;sy=null;lock.style.transition="";if(dy<-120)unlock();else lock.style.transform=""});
$("#fl").onclick=e=>{e.stopPropagation();e.currentTarget.classList.toggle("on")};
$("#fl").onpointerdown=$("#cm").onpointerdown=e=>e.stopPropagation();
$("#island").onclick=()=>{if(lock.classList.contains("up"))relock()};

/* 앱 열기/닫기 */
const appEl=$("#app");let cur=null;
function openApp(id,key){
  const el=document.querySelector(`#pages [data-app="${id}"] svg,#dock [data-app="${id}"] svg`);
  const p=$("#phone").getBoundingClientRect();
  if(el){const r=el.getBoundingClientRect();appEl.style.transformOrigin=`${r.left+r.width/2-p.left}px ${r.top+r.height/2-p.top}px`}
  cur=id;const LT=["cal","map","msg","kakao","mail","photo","set"].includes(id);appEl.className=LT?"light":"";$("#phone").classList.toggle("lightapp",LT);appEl.innerHTML=render(id,key);void appEl.offsetWidth;const pg=$("#phg");if(pg)pg.scrollTop=1e5;if(key){const cs=$("#cs"),c=cs&&cs.querySelector('.c[data-k="'+key+'"]');if(c)cs.scrollTop=c.closest(".mo").offsetTop-cs.offsetTop}appEl.classList.add("open");
}
function closeApp(fast){appEl.classList.remove("open");$("#phone").classList.remove("lightapp");cur=null}
document.addEventListener("click",e=>{const a=e.target.closest("[data-app]");if(a&&!appEl.classList.contains("open"))openApp(a.dataset.app);
  const k=e.target.closest("[data-k]");if(k)press(k.dataset.k)});
$("#bar").addEventListener("pointerdown",e=>{e.stopPropagation()});
let by=null;
$("#bar").addEventListener("pointerdown",e=>by=e.clientY);
addEventListener("pointerup",e=>{if(by==null)return;const d=by-e.clientY;by=null;
  if(Math.abs(d)<8||d>30){if(!lock.classList.contains("up"))unlock();else if(cur)closeApp()}});

/* 앱 화면 */
function render(id,key){
  if(id==="clock")return `<div id="bigclock"></div><div style="text-align:center;color:var(--dim);margin-top:8px" id="bigdate"></div>`;
  if(id==="calc"){const rows=[["AC","f"],["±","f"],["%","f"],["÷","o"],["7"],["8"],["9"],["×","o"],["4"],["5"],["6"],["−","o"],["1"],["2"],["3"],["+","o"],["0","z"],[".",""],["=","o"]];
    return `<div id="cd">0</div><div class="calc">${rows.map(([k,c])=>`<button class="${c||""}" data-k="${k}">${k}</button>`).join("")}</div>`}
  if(id==="memo"){let v="";try{v=localStorage.getItem("memo")||""}catch(e){}
    return `<div class="ah">메모</div><textarea id="memo" placeholder="여기에 입력하세요">${v.replace(/</g,"&lt;")}</textarea>`}
  if(id==="cal")return calHTML(key);
  if(id==="map")return mapHTML();
  if(id==="msg")return msgHTML();
  if(id==="kakao")return kkHTML();
  if(id==="mail")return mailHTML();
  if(id==="photo")return photoHTML();
  if(id==="set")return setHTML();
  return `<div class="ah">${APPS[id][0]}</div><div class="soon">아직 준비 중이에요</div>`;
}
document.addEventListener("input",e=>{if(e.target.id==="memo"){try{localStorage.setItem("memo",e.target.value)}catch(x){}}});


function dayPanel(key){
  const[y,m,d]=key.split("-").map(Number),w=new Date(y,m-1,d).toLocaleDateString("ko-KR",{weekday:"long"}),l=EVENTS.filter(e=>e.date===key);
  return `<div class="dt">${m}월 ${d}일 ${w}</div>`+(l.length?l.map(e=>`<div class="er"><i></i><div>${e.title}<small>종일</small></div></div>`).join(""):`<div class="er" style="color:#8e8e93">일정 없음</div>`);
}
function calHTML(key0){
  const t=new Date(),ty=t.getFullYear(),tm=t.getMonth(),td=t.getDate(),ev={},tk=`${ty}-${String(tm+1).padStart(2,"0")}-${String(td).padStart(2,"0")}`,sk=key0||tk;
  EVENTS.forEach(e=>(ev[e.date]=ev[e.date]||[]).push(e.title));
  const st='fill="none" stroke="#ff3b30" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"';
  let h=`<div class="ch"><div class="cn"><span class="l" data-back><svg width="13" height="22" viewBox="0 0 13 22"><path d="M11 2L2 11l9 9" ${st} stroke-width="3"/></svg><span id="cy">${key0?key0.slice(0,4):ty}년</span></span><span class="r"><svg width="28" height="28" viewBox="0 0 28 28"><rect x="3" y="3" width="22" height="9" rx="4.5" ${st}/><rect x="3" y="16" width="22" height="9" rx="4.5" ${st}/></svg><svg width="28" height="28" viewBox="0 0 28 28"><circle cx="12" cy="12" r="8" ${st}/><path d="M18 18l7 7" ${st}/></svg><svg width="28" height="28" viewBox="0 0 28 28"><path d="M14 3v22M3 14h22" ${st}/></svg></span></div><div id="cm">${key0?+key0.slice(5,7):tm+1}월</div><div class="wk">${"일월화수목금토".split("").map((d,i)=>`<i class="${i%6?"":"we"}">${d}</i>`).join("")}</div></div><div class="cs" id="cs">`;
  for(let k=0;k<12;k++){
    const d=new Date(ty,tm+k,1),y=d.getFullYear(),m=d.getMonth(),n=new Date(y,m+1,0).getDate();
    h+=`<div class="mo" data-y="${y}" data-m="${m}">${k?`<div class="ml">${m+1}월</div>`:""}<div class="g">`+"<div class=\"c\"></div>".repeat(d.getDay());
    for(let i=1;i<=n;i++){
      const wd=(d.getDay()+i-1)%7,key=`${y}-${String(m+1).padStart(2,"0")}-${String(i).padStart(2,"0")}`;
      h+=`<div class="c${wd%6?"":" we"}" data-k="${key}"><b class="${key===tk?"td":""}${key===sk?" sel":""}">${i}</b>${(ev[key]||[]).map(x=>`<u title="${x}"></u>`).join("")}</div>`;
    }
    h+="</div></div>";
  }
  return h+`</div><div id="dp">${dayPanel(sk)}</div><div class="cb"><span data-today>오늘</span><span>캘린더</span><span>초대</span></div>`;
}
document.addEventListener("scroll",e=>{
  if(e.target.id!=="cs")return;const top=e.target.getBoundingClientRect().top+40;let c=null;
  e.target.querySelectorAll(".mo").forEach(m=>{if(m.getBoundingClientRect().top<=top)c=m});
  if(c){$("#cm").textContent=(+c.dataset.m+1)+"월";$("#cy").textContent=c.dataset.y+"년"}
},true);
document.addEventListener("click",e=>{
  const cc=e.target.closest(".c[data-k]");
  if(cc){document.querySelectorAll(".c b.sel").forEach(b=>b.classList.remove("sel"));cc.querySelector("b").classList.add("sel");$("#dp").innerHTML=dayPanel(cc.dataset.k)}
  if(e.target.closest("[data-back]"))closeApp();
  if(e.target.closest("[data-today]"))$("#cs").scrollTo({top:0,behavior:"smooth"});
});
function mapHTML(){

let c="0",acc=null,op=null,fresh=false;
const calc=(a,b,o)=>o==="+"?a+b:o==="−"?a-b:o==="×"?a*b:b===0?NaN:a/b;
const fmt=s=>{if(s==="NaN")return"오류";let[i,d]=s.split(".");i=i.replace(/\B(?=(\d{3})+(?!\d))/g,",");return d!==undefined?i+"."+d:i};
function press(k){
  if(/\d/.test(k)){c=(fresh||c==="0")?k:c+k;fresh=false}
  else if(k==="."){if(fresh){c="0.";fresh=false}else if(!c.includes("."))c+="."}
  else if(k==="AC"){c="0";acc=null;op=null;fresh=false}
  else if(k==="±")c=String(-c);
  else if(k==="%")c=String(+(c/100).toPrecision(10));
  else{if(op&&!fresh)c=String(+calc(acc,+c,op).toPrecision(10));
    if(k==="="){op=null}else{acc=+c;op=k}fresh=true}
  const d=$("#cd");if(d){d.textContent=fmt(c);d.style.fontSize=c.length>8?"52px":"78px"}
}

  for(let i=0;i<12;i++){const a=i*Math.PI/6,s=Math.sin(a),c=Math.cos(a),r2=i%3?43:41;tk+=`<line x1="${(50+45*s).toFixed(1)}" y1="${(50-45*c).toFixed(1)}" x2="${(50+r2*s-0).toFixed(1)}" y2="${(50-r2*c).toFixed(1)}" stroke="#1c1c1e" stroke-width="${i%3?1:2}"/>`}
  const nm=[["12",50,27],["3",74,53],["6",50,79],["9",26,53]].map(n=>`<text x="${n[1]}" y="${n[2]}" font-size="10" font-weight="600" text-anchor="middle" fill="#1c1c1e">${n[0]}</text>`).join("");
  const clk=`<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="47" fill="#fff"/>${tk}${nm}<g id="hh"><line x1="50" y1="54" x2="50" y2="29" stroke="#1c1c1e" stroke-width="3.2" stroke-linecap="round"/></g><g id="mh"><line x1="50" y1="56" x2="50" y2="17" stroke="#1c1c1e" stroke-width="2.4" stroke-linecap="round"/></g><g id="sh"><line x1="50" y1="58" x2="50" y2="14" stroke="#ff9500" stroke-width="1"/></g><circle cx="50" cy="50" r="2.4" fill="#ff9500"/></svg>`;
  return `<div class="wd"><div class="wb wclk">${clk}</div><span>시계</span></div><div class="wd" data-app="cal"><div class="wb wcal"><div class="d1">${t.toLocaleDateString("ko-KR",{weekday:"long"})}</div><div class="d2">${t.getDate()}</div>${e?`<div class="ev"><i></i><div><b>${e.title}</b><small>${label(e.n)}</small></div></div>`:`<div class="ev"><small>일정 없음</small></div>`}</div><span>캘린더</span></div>`;
}
function updW(){
  const h=$("#hh");if(!h)return;const t=new Date(),m=t.getMinutes()+t.getSeconds()/60;
  h.setAttribute("transform",`rotate(${(t.getHours()%12+m/60)*30} 50 50)`);
  $("#mh").setAttribute("transform",`rotate(${m*6} 50 50)`);
  $("#sh").setAttribute("transform",`rotate(${t.getSeconds()*6} 50 50)`);
}
$("#pages .pg").insertAdjacentHTML("afterbegin",wgHTML());
tick();setInterval(tick,1000);drawNotes();
</script>
